events {}

http {
  server {
    listen 8080;
    server_name _;

    # The temporary public tunnel may reach only the WhatsApp verification and
    # event endpoint. No dashboard, API, assets, or session-bearing route is
    # exposed through this proxy.
    location ~ ^/webhooks/whatsapp/ {
      if ($request_method !~ ^(GET|POST)$) {
        return 405;
      }

      proxy_pass http://rails:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      return 404;
    }
  }
}
